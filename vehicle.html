<!doctype html><meta charset="utf-8"><title>Vehicle test</title><iframe id="game" src="../index.html?test=1" style="width:1100px;height:800px"></iframe><pre id="result">RUNNING</pre><script>const f=document.getElementById('game');f.onload=()=>{try{const api=f.contentWindow.__persistanTest;const assert=(c,m)=>{if(!c)throw Error(m)};assert(api,'test API');assert(api.vehicleDamage(2,{vehicle:'tank',armor:3})===0,'tank armor');assert(api.vehicleDamage(3,{vehicle:'technical',armor:1})===2,'technical armor');assert(api.vehicleRoster({threat:5}).length===2,'high threat');assert(api.vehicleRoster({threat:2}).length===0,'low threat');api.state().units.filter(u=>u.vehicle).forEach(u=>assert(u.hp>0,'vehicle hp'));document.getElementById('result').textContent='PASS';}catch(e){document.getElementById('result').textContent='FAIL: '+e.message}};</script>
