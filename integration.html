<!doctype html><html><meta charset="utf-8"><title>W1.2.0 integration</title><body><div id="results">RUNNING</div><iframe id="game" src="../index.html?test=1" width="1024" height="768"></iframe><script>
const checks=[];function assert(name,ok){checks.push({name,ok:!!ok})}const frame=document.getElementById('game');frame.onload=()=>{setTimeout(()=>{try{const w=frame.contentWindow,d=w.document,api=w.__persistanTest;assert('boot API',!!api);assert('4 deployed',api.state().units.filter(x=>x.team==='friendly').length===4);assert('enemy units',api.state().units.filter(x=>x.team==='enemy').length>=2);assert('battle canvas',d.getElementById('battle').width>0);d.getElementById('command').click();assert('command opens',!d.getElementById('command-overlay').classList.contains('hidden'));d.getElementById('command-close').click();d.getElementById('roster').click();assert('roster opens',!d.getElementById('roster-overlay').classList.contains('hidden'));d.getElementById('roster-close').click();d.getElementById('customize').click();assert('editor opens',!d.getElementById('editor-overlay').classList.contains('hidden'));const original=api.state().units[0].name;const input=d.getElementById('edit-name');input.value='TEST_UNSAVED';input.dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('editor-close').click();d.getElementById('customize').click();assert('cancel edit rollback',d.getElementById('edit-name').value===original);d.getElementById('editor-close').click();d.getElementById('end').click();assert('enemy phase',api.state().phase==='enemy');setTimeout(()=>{assert('turn returns',api.state().phase==='friendly'||api.state().gameover);api.finish(true);assert('result opens',!d.getElementById('result-overlay').classList.contains('hidden'));assert('mission recorded',api.state().strategy.missions===1);d.getElementById('result-close').click();assert('result closes',d.getElementById('result-overlay').classList.contains('hidden'));d.getElementById('launch').click();assert('next mission started',api.state().turn===1&&!api.state().gameover);finish()},650)}catch(e){checks.push({name:'exception: '+e.stack,ok:false});finish()}},200)};function finish(){document.getElementById('results').textContent=JSON.stringify({pass:checks.every(x=>x.ok),checks})}
</script></body></html>
