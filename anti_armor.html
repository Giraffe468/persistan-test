<!doctype html><meta charset="utf-8"><title>Anti-armor smoke test</title><iframe id="game" src="../index.html?test=1" style="width:1000px;height:750px"></iframe><pre id="result">RUNNING</pre><script>game.onload=()=>{try{const a=game.contentWindow.__persistanTest;const ok=(v,m)=>{if(!v)throw Error(m)};ok(a,'test API');ok(a.antiArmorDamage(a.AT_LAUNCHERS.rpg,{armor:3})===6,'RPG damage');ok(a.antiArmorDamage(a.AT_LAUNCHERS.javelin,{armor:3})===16,'Javelin damage');ok(a.antiArmorDamage(a.AT_LAUNCHERS.rpg,{armor:1})===9,'APC damage');ok(a.state().units.some(x=>x.team==='friendly'&&x.atAmmo?.rpg===2),'initial ammo');result.textContent='PASS';}catch(e){result.textContent='FAIL: '+e.message}};</script>
