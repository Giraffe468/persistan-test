<!doctype html><meta charset="utf-8"><title>W1.3 movement test</title><pre id="result">RUNNING</pre><iframe id="f" src="../index.html?test=1" width="1024" height="768"></iframe><script>
const f=document.getElementById('f'),r=document.getElementById('result');f.onload=()=>setTimeout(()=>{try{const a=f.contentWindow.__persistanTest;const u=a.state().units.find(x=>x.team==='friendly');a.action(u.x,u.y+1);const during=a.state();if(!during.moving)throw Error('movement did not start');setTimeout(()=>{try{const after=a.state(),v=after.units.find(x=>x.id===u.id);if(after.moving||v.y!==u.y+1||v.ap!==u.ap-1)throw Error('movement failed '+JSON.stringify({after:after.moving,v,u}));a.action(v.x,v.y+1);a.start();setTimeout(()=>{const fresh=a.state();if(fresh.moving||fresh.turn!==1)throw Error('restart race');r.textContent='PASS: move animation, AP, restart cancellation'}catch(e){r.textContent='FAIL: '+e.stack}},100)}catch(e){r.textContent='FAIL: '+e.stack}},450)}catch(e){r.textContent='FAIL: '+e.stack}},250);
</script>
